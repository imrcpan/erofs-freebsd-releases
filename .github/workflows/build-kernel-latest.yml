name: build-kernel-latest

on:
  # Manual only, from the Actions tab.  The check job below stops a run whose
  # commit is already released before the expensive build starts.
  workflow_dispatch:
    inputs:
      src_repo:
        description: "Target FreeBSD Repository"
        default: "https://github.com/imrcpan/erofs-freebsd.git"
        required: true
        type: string
      src_branch:
        description: "Target FreeBSD Branch"
        default: "dev"
        required: true
        type: string
      force:
        description: "Rebuild and replace the assets of an existing release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-kernel-latest
  cancel-in-progress: false

env:
  SRC_REPO: ${{ github.event.inputs.src_repo }}
  SRC_BRANCH: ${{ github.event.inputs.src_branch }}
  FORCE: ${{ github.event.inputs.force }}
  BUNDLE: ${{ github.workspace }}/freebsd-built.tar.zst

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
      tag: ${{ steps.resolve.outputs.tag }}
      title: ${{ steps.resolve.outputs.title }}
    steps:
      - name: Resolve source commit
        id: resolve
        run: |
          set -euo pipefail
          sha="$(git ls-remote "$SRC_REPO" "${SRC_BRANCH:-HEAD}" | awk 'NR == 1 { print $1 }')"
          if [ -z "$sha" ]; then
            echo "::error::cannot resolve ${SRC_BRANCH:-HEAD} in $SRC_REPO"
            exit 1
          fi
          short="${sha:0:12}"
          date="$(date -u +%y%m%d)"
          {
            echo "sha=$sha"
            echo "short=$short"
            echo "tag=${date}_${short}"
            echo "title=EROFS FreeBSD Kernel ${short}"
          } >> "$GITHUB_OUTPUT"
          echo "#### $SRC_REPO ${SRC_BRANCH:-HEAD} -> $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail fast if this commit is already released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so tell gh which repository to talk to.
          GH_REPO: ${{ github.repository }}
          SHORT: ${{ steps.resolve.outputs.short }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "#### force on, ${SHORT} will be rebuilt and its assets replaced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing="$(gh release list --limit 500 --json tagName --jq '.[].tagName' | grep "_${SHORT}\$" || true)"
          if [ -n "$existing" ]; then
            echo "::error::commit ${SHORT} is already released as ${existing//$'\n'/, }; rerun with force to rebuild"
            exit 1
          fi
          echo "#### ${SHORT} is not released yet" >> "$GITHUB_STEP_SUMMARY"

  build-kernel:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # GENERIC carries the std.debug set (WITNESS, INVARIANTS, buffer
          # tracking), which is what produces a usable crash report.
          - name: debug
            kernconf: GENERIC
            asset: erofs_freebsd_kernel_debug_amd64_${{ needs.check.outputs.short }}.tar.gz
            keep-full: "true"
            expect-witness: "true"
          # GENERIC-NODEBUG is the tree's own WITNESS/INVARIANTS free config,
          # meant for benchmarks; see its header comment.
          - name: nodebug
            kernconf: GENERIC-NODEBUG
            asset: erofs_freebsd_kernel_amd64_${{ needs.check.outputs.short }}.tar.gz
            keep-full: "false"
            expect-witness: "false"
    steps:
      - name: Build the ${{ matrix.kernconf }} kernel
        uses: imrcpan/freebsd-kernel-ci-tester@main
        with:
          src-repo: ${{ env.SRC_REPO }}
          src-branch: ${{ needs.check.outputs.sha }}
          kernconf: ${{ matrix.kernconf }}
          # The world is never shipped, so always build against the prebuilt one.
          skip-world: true
          export-image: ${{ env.BUNDLE }}

      - name: Package the kernel
        id: package
        env:
          SHA: ${{ needs.check.outputs.sha }}
          ASSET: ${{ matrix.asset }}
          KERNCONF: ${{ matrix.kernconf }}
          KEEP_FULL: ${{ matrix.keep-full }}
          EXPECT_WITNESS: ${{ matrix.expect-witness }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/kernel"
          out="$work/out"
          mkdir -p "$out"

          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils zstd binutils
          sudo modprobe ufs || echo "::warning::could not load the ufs module"

          # export-image leaves the powered-off VM behind: a qcow2 disk plus
          # the ssh key.  Only the disk is needed here.
          tar --zstd -xf "$BUNDLE" -C "$work" disk.qcow2
          qemu-img convert -O raw "$work/disk.qcow2" "$work/disk.raw"
          rm -f "$work/disk.qcow2"

          loop="$(sudo losetup -fP --show "$work/disk.raw")"
          echo "attached $loop"
          cleanup() {
            sudo umount -R /mnt/freebsd 2>/dev/null || true
            sudo losetup -d "$loop" 2>/dev/null || true
            rm -f "$work/disk.raw"
          }
          trap cleanup EXIT

          # The release images are BASIC-CLOUDINIT-ufs; the ufs root sits in one
          # of the partitions, so try them until /boot/kernel shows up.
          sudo mkdir -p /mnt/freebsd
          root=""
          for part in "${loop}"p*; do
            if sudo mount -t ufs -o ro,ufstype=ufs2 "$part" /mnt/freebsd 2>/dev/null; then
              if [ -d /mnt/freebsd/boot/kernel ]; then
                root=/mnt/freebsd
                echo "mounted $part"
                break
              fi
              sudo umount /mnt/freebsd
            fi
          done
          if [ -z "$root" ]; then
            echo "::error::no UFS root with /boot/kernel in the exported image"
            lsblk -f
            exit 1
          fi

          # Make sure the debug options really are in the state this matrix
          # entry promises, so a wrong kernconf cannot slip into a release.
          witness="$(readelf --syms --wide "$root/boot/kernel/kernel" \
            | awk '{ print $8 }' | grep -c '^_*witness_' || true)"
          echo "$KERNCONF: $witness witness symbols"
          if [ "$EXPECT_WITNESS" = "true" ] && [ "$witness" -eq 0 ]; then
            echo "::error::$KERNCONF has no WITNESS symbols, expected a debug kernel"
            exit 1
          fi
          if [ "$EXPECT_WITNESS" = "false" ] && [ "$witness" -ne 0 ]; then
            echo "::error::$KERNCONF has WITNESS symbols, expected a nodebug kernel"
            exit 1
          fi
          if [ "$EXPECT_WITNESS" = "false" ] && [ -e "$root/boot/kernel/kernel.full" ]; then
            echo "::warning::nodebug kernel still ships kernel.full"
          fi

          cat > "$work/build-info.txt" <<EOF
          source-repo: $SRC_REPO
          source-branch: $SRC_BRANCH
          commit: $SHA
          kernconf: $KERNCONF
          built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          if [ "$KEEP_FULL" = "true" ]; then
            sudo tar -C "$root" -czf "$out/$ASSET" boot/kernel -C "$work" build-info.txt
          else
            # kernel.full is only useful when debugging, and it is by far the
            # largest thing in the tree.
            sudo tar -C "$root" --exclude='boot/kernel/kernel.full' \
              -czf "$out/$ASSET" boot/kernel -C "$work" build-info.txt
          fi
          sudo chown "$(id -u):$(id -g)" "$out/$ASSET"
          ls -lh "$out"

          echo "path=$out/$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload the kernel tarball
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.name }}-${{ needs.check.outputs.short }}
          path: ${{ steps.package.outputs.path }}
          retention-days: 1
          compression-level: 0

  publish:
    needs: [check, build-kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the kernel tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: kernel-*-${{ needs.check.outputs.short }}
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          TITLE: ${{ needs.check.outputs.title }}
          SHORT: ${{ needs.check.outputs.short }}
          SHA: ${{ needs.check.outputs.sha }}
          ASSETS: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          mapfile -t files < <(ls -1 "$ASSETS"/*.tar.gz)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "::error::expected 2 kernel tarballs, found ${#files[@]}"
            ls -l "$ASSETS"
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "FreeBSD kernels built from $SRC_REPO ($SRC_BRANCH)."
            echo
            echo "* commit: \`$SHA\`"
            echo "* built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "| asset | kernel config | purpose |"
            echo "| --- | --- | --- |"
            echo "| \`erofs_freebsd_kernel_amd64_${SHORT}.tar.gz\` | GENERIC-NODEBUG | benchmarks, WITNESS and INVARIANTS compiled out |"
            echo "| \`erofs_freebsd_kernel_debug_amd64_${SHORT}.tar.gz\` | GENERIC | debugging, includes kernel.full |"
            echo
            echo "Each tarball holds \`boot/kernel\` (kernel and modules) plus \`build-info.txt\`."
            echo "Unpack it at the root of a matching FreeBSD system:"
            echo
            echo '```sh'
            echo 'tar -xzf <asset> -C /'
            echo '```'
            echo
            echo "sha256:"
            echo
            echo '```'
            (cd "$ASSETS" && sha256sum -- *.tar.gz)
            echo '```'
          } > "$notes"

          if [ "$FORCE" = "true" ]; then
            # A rebuild of this commit supersedes its older, differently dated
            # releases as well, so drop those entirely.
            while read -r tag; do
              [ -n "$tag" ] || continue
              [ "$tag" = "$TAG" ] && continue
              echo "removing release $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done < <(gh release list --limit 500 --json tagName --jq '.[].tagName' | grep "_${SHORT}\$" || true)

            # Start the target release from an empty asset list.
            if gh release view "$TAG" >/dev/null 2>&1; then
              while read -r name; do
                [ -n "$name" ] || continue
                echo "removing asset $name"
                gh release delete-asset "$TAG" "$name" --yes
              done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}"
            gh release edit "$TAG" --title "$TITLE" --notes-file "$notes"
          else
            gh release create "$TAG" "${files[@]}" --title "$TITLE" --notes-file "$notes"
          fi
          echo "#### released $TAG with ${#files[@]} assets" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release notes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ needs.check.outputs.short }}
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 1
          if-no-files-found: ignore
